<!doctype html>
<!-- Popup page shown when the extension icon is clicked. -->

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auto Applier</title>
    <style>
      body { width: 340px; margin: 0; padding: 16px; font-family: system-ui, sans-serif; font-size: 13px; }
      h1 { margin: 0 0 12px; font-size: 16px; }
      .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
      label { font-weight: 600; }
      input, select { padding: 6px 8px; font: inherit; }
      button { padding: 8px 14px; font: inherit; cursor: pointer; }
      .errors { margin: 0 0 10px; padding-left: 18px; color: #b3261e; }
      p { margin: 8px 0 0; }
    </style>
  </head>
  <body>
    <h1>Auto Applier</h1>
    <main id="app">Loading…</main>
    <script src="popup.js"></script>
  </body>
</html>
