<!doctype html>
<!-- Popup page shown when the extension icon is clicked. -->

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auto Applier</title>
    <style>
      body { width: 340px; margin: 0; padding: 16px; font-family: system-ui, sans-serif; font-size: 13px; }
      h1 { margin: 0 0 12px; font-size: 16px; }
      .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
      label { font-weight: 600; }
      input, select, textarea { padding: 6px 8px; font: inherit; }
      .field-hint { color: #666; font-size: 12px; }
      button { padding: 8px 14px; font: inherit; cursor: pointer; }
      .errors { margin: 0 0 10px; padding-left: 18px; color: #b3261e; }
      p { margin: 8px 0 0; }
      .fill-panel { margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid #ddd; }
      .fill-panel button { width: 100%; font-weight: 600; }
      .fill-panel progress { width: 100%; height: 10px; margin-top: 8px; accent-color: #1a73e8; }
      .fill-panel .progress-caption { margin: 2px 0 0; color: #444; font-size: 12px; }
      .fill-panel .notes { margin: 4px 0 0; padding-left: 18px; color: #8a5a00; font-size: 12px; }
      .settings { margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid #ddd; }
      .settings summary { cursor: pointer; font-weight: 600; margin-bottom: 8px; }
      .settings .buttons { display: flex; gap: 8px; }
      .settings .note { color: #666; font-size: 12px; }
      .settings .provider { margin-top: 12px; padding-top: 8px; border-top: 1px solid #eee; }
      .settings .provider h3 { margin: 0 0 8px; font-size: 13px; }
      .resume-panel { margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid #ddd; }
      .resume-panel .findings { font-size: 12px; }
      .resume-panel .findings ul { margin: 4px 0; padding-left: 18px; }
      .resume-panel .warnings { color: #8a5a00; }
    </style>
  </head>
  <body>
    <h1>Auto Applier</h1>
    <section id="fill-panel" class="fill-panel"></section>
    <details id="settings" class="settings">
      <summary>LLM settings</summary>
      <div id="settings-body"></div>
    </details>
    <section id="resume-panel" class="resume-panel"></section>
    <main id="app">Loading…</main>
    <script src="popup.js"></script>
  </body>
</html>
